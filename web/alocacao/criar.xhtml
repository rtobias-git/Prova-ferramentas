<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE composition PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:ui="jakarta.faces.facelets"
                template="/WEB-INF/template.xhtml"
                xmlns:h="jakarta.faces.html"
                xmlns:f="jakarta.faces.core"
                xmlns:p="http://primefaces.org/ui">

    <ui:define name="content">

        <h:form id="form" class="align-center">

            <p:panelGrid columns="2" layout="tabular" style="width: 100%">
                <f:facet name="header">
                    Alocação
                </f:facet>

                <h:outputLabel value="Projeto" for="@next" />
                <p:selectOneMenu required="true" 
                                 requiredMessage="Selecione o Projeto" 
                                 style="width: 250px" value="#{alocacaoController.projetoSelecionado}">
                    <f:selectItem itemLabel="Selecione" itemValue="" />
                    <f:selectItems value="#{alocacaoController.buscarTodosProjetos()}"
                                   var="item" itemLabel="#{item.nome}" itemValue="#{item}"/>
                </p:selectOneMenu>
                <h:outputLabel value="Desenvolvedor" for="@next" />
                <p:selectOneMenu required="true" 
                                 requiredMessage="Selecione o Desenvolvedor" 
                                 style="width: 250px" value="#{alocacaoController.desenvolvedorSelecionado}">
                    <f:selectItem itemLabel="Selecione" itemValue="" />
                    <f:selectItems value="#{alocacaoController.buscarTodosDesenvolvedores()}"
                                   var="item" itemLabel="#{item.nome}" itemValue="#{item}"/>
                </p:selectOneMenu>
                
                <h:outputLabel value="Quantidade de horas semanais" for="@next" />
                <p:inputNumber rendered="true"
                               required="true"
                               minValue="0"
                               requiredMessage="Informe a quantidade de horas semanais"
                               size="3" value="#{alocacaoController.quantidadeHorasSemanais}" />
               
                <h:outputLabel value="Valor por hora" for="@next" />
                <p:inputNumber rendered="true"
                               required="true"
                               minValue="0"
                               requiredMessage="Informe o valor por hora"
                               size="5" value="#{alocacaoController.valorHora}" />
            </p:panelGrid>

            <p:commandButton value="Alocar" 
                             action="#{alocacaoController.inserir()}"
                             update=":growl tabela"/>

        </h:form>
    </ui:define>
</ui:composition>
